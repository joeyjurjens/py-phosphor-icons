[project]
name = "py-phosphor-icons"
version = "0.1.0"
description = "Phosphor Icons for Python: the SVGs, a loader, and search over them"
readme = "README.md"
authors = [
    { name = "Joey Jurjens", email = "joeyjurjens@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
keywords = ["phosphor", "icons", "svg"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_phosphor_icons"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
